# Configure Yarn settings
nodeLinker: node-modules

# Configure the package registry
npmRegistryServer: "https://registry.npmjs.org"

# Configure the package cache
enableGlobalCache: true

# Configure the package scripts
enableScripts: true

# Configure the package checksum behavior
checksumBehavior: "throw"

# Configure the package resolution
packageExtensions:
  "**":
    dependencies:
      typescript: "^5.0.0"

# Configure the package resolution
resolutionMode: "highest"

# Configure the package lockfile
lockfileFilename: "yarn.lock"

# Configure the package network concurrency
networkConcurrency: 8

# Configure the package offline mode
offline: false

# Configure the package prefer offline
preferOffline: false

# Configure the package frozen lockfile
frozenLockfile: true

# Configure the package cache folder
cacheFolder: ".yarn/cache"

# Configure the package checksum verification
checksumBehavior: "throw"

# Configure the package network timeout
networkTimeout: 300000

# Configure the package prefer offline
preferOffline: false

# Configure the package registry
npmRegistryServer: "https://registry.npmjs.org"
